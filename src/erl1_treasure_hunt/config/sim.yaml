# Parameters for the simulation. The top-level keys must match the node names.
aruco_detector:
  ros__parameters:
    image_topic: /camera/image
    image_transport: raw
    detections_topic: /aruco/detections
    marker_image_topic: /marker_image
    reached_topic: /hunt/reached

visual_servoing:
  ros__parameters:
    detections_topic: /aruco/detections
    camera_info_topic: /camera/camera_info
    cmd_vel_topic: /cmd_vel
    desired_side: 166.0
    reference_fx: 381.36
    k_omega: 0.003
    k_v: 0.004
    max_omega: 0.6
    max_v: 0.3
    search_speed: 0.2
    align_tolerance: 30.0
    side_tolerance: 4.0
    lost_timeout: 2.0

rotation:
  ros__parameters:
    odom_topic: /odometry/filtered
    cmd_vel_topic: /cmd_vel
    k_yaw: 1.5
    max_omega: 0.8
    min_omega: 0.15
    yaw_tolerance: 0.02

treasure_hunt:
  ros__parameters:
    instruction_ids: [1, 2, 3]
    instruction_angles: [-1.5708, 3.14159, 1.5708]
    final_marker_id: 4
    reached_topic: /hunt/reached
    status_topic: /hunt/status
